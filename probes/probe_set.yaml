# Extraction-quality probe set for Context.dev.
#
# Each probe is a hypothesis to check on a LIVE run (needs CONTEXT_DEV_API_KEY).
# Nothing here asserts a conclusion about the API; the harness records what
# actually happens and the eval report is filled in from real results.
#
# Cost estimate per full live run at documented pricing: ~13 scrapes (1 credit
# each) + 3 searches (1 credit per 10 results) = under 20 credits of the
# free tier.

probes:
  # --- English baselines (sanity: these should pass on any working scraper) ---
  - id: baseline-en-docs
    operation: scrape
    target: https://example.com
    expect:
      min_chars: 20
    notes: Control probe. If this fails, the harness or key is broken, not the page.

  - id: baseline-en-js-spa
    operation: scrape
    target: https://react.dev
    expect:
      min_chars: 500
    notes: JS-heavy docs SPA. Context.dev renders every request in a real browser
      per their homepage, so this tests that claim on a React-rendered page.

  # --- Indic-language pages (the wedge: extraction quality in non-Latin scripts) ---
  - id: hindi-news-bbc
    operation: scrape
    target: https://www.bbc.com/hindi
    expect:
      min_chars: 300
      script: devanagari
      min_script_chars: 100
    notes: Hindi front page. Some scrapers return English chrome or
      transliterated stubs, so this checks for real Devanagari body text.

  - id: hindi-news-jagran
    operation: scrape
    target: https://www.jagran.com
    expect:
      min_chars: 300
      script: devanagari
      min_script_chars: 100
    notes: High-traffic Hindi daily with heavy ad/JS chrome. Tests mainContentOnly
      filtering on a noisy Indic page.

  - id: tamil-news-dailythanthi
    operation: scrape
    target: https://www.dailythanthi.com
    expect:
      min_chars: 300
      script: tamil
      min_script_chars: 100
    notes: Tamil daily. Same hypothesis as the Hindi probes, different script.

  - id: india-govt-pib
    operation: scrape
    target: https://pib.gov.in
    expect:
      min_chars: 300
    notes: Press Information Bureau. Indian govt portals are often JS-heavy with
      unusual markup; a realistic RAG-grounding target for India-focused agents.

  # --- Search quality probes ---
  - id: search-en-baseline
    operation: search
    target: AI agent web scraping API pricing 2026
    num_results: 10
    expect:
      min_results: 5
    notes: Baseline search probe.

  - id: search-india-localized
    operation: search
    target: UPI autopay RBI circular site:pib.gov.in
    num_results: 10
    expect:
      min_results: 3
    notes: India-localized query with a site-restricted operator. Tests operator handling
      plus freshness on Indian regulatory content.

  # --- Failure-mode probe (exercises the harness, not the API) ---
  - id: scrape-404-page
    operation: scrape
    target: https://example.com/this-page-does-not-exist-xyz
    expect:
      min_chars: 0
      error_code: NOT_FOUND
    notes: Expects the API's documented failure semantics (404s are billed at
      base price per the FAQ; outputs carry success=false with error_code).
      Records how cleanly the failure surfaces.

  # --- Extended probes, added 2026-10-27: more scripts, JS rendering,
  # long pages, mixed script, non-English search, walled surfaces ---
  - id: bengali-news-anandabazar
    operation: scrape
    target: https://www.anandabazar.com/
    expect:
      min_chars: 300
      script: bengali
      min_script_chars: 100
    notes: Bengali daily. Same hypothesis as the Hindi/Tamil probes,
      third script family.

  - id: telugu-news-eenadu
    operation: scrape
    target: https://www.eenadu.net/
    expect:
      min_chars: 300
      script: telugu
      min_script_chars: 100
    notes: Telugu daily. Same hypothesis, fourth script family.

  - id: js-rendered-quotes
    operation: scrape
    target: https://quotes.toscrape.com/js/
    expect:
      min_chars: 100
    notes: The quotes on this page exist only after JavaScript execution.
      react.dev tests a JS docs SPA; this tests content that is absent
      from the raw HTML entirely.

  - id: long-form-wikipedia
    operation: scrape
    target: https://en.wikipedia.org/wiki/India
    expect:
      min_chars: 5000
    notes: Long, dense article. Tests completeness and mainContentOnly on
      a big page, and records latency and credits at that size.

  - id: mixed-script-wikipedia
    operation: scrape
    target: https://en.wikipedia.org/wiki/Hindi
    expect:
      min_chars: 500
      script: devanagari
      min_script_chars: 50
    notes: English article studded with Devanagari terms. Checks the
      script bits survive instead of being transliterated or dropped
      when the surrounding text is English.

  - id: search-hindi-query
    operation: search
    target: मुंबई लोकल ट्रेन समय सारणी
    num_results: 10
    languages: ["hi"]
    expect:
      min_results: 3
    notes: Non-English query with the languages parameter. Tests search
      quality when the query itself is in Devanagari.

  - id: login-wall-x-home
    operation: scrape
    target: https://x.com/home
    expect:
      max_chars: 2000
      allow_error: true
    notes: Login-walled surface. The API must fail honestly (an error or
      an unsuccessful output) or return only the wall. A full page of
      content here would be a finding to report, not a pass.
